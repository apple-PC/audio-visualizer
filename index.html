<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>音波 · 音频可视化</title>
<style>
  :root{
    --bg:#04050a; --fg:#e8ecf4; --muted:#7c8699;
    --c1:#22d3ee; --c2:#a855f7;
    --c1-glow:rgba(34,211,238,.45);
    --c2-glow:rgba(168,85,247,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; user-select:none;
  }
  #stage{position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(circle at 50% 45%, #0c1223 0%, #04050a 70%);}
  #stage::before{
    content:''; position:absolute;inset:-18%;
    background:
      radial-gradient(circle at 28% 30%, var(--c1-glow) 0%, transparent 42%),
      radial-gradient(circle at 74% 72%, var(--c2-glow) 0%, transparent 42%);
    opacity:.24; filter:blur(70px);
    animation:ambient 20s ease-in-out infinite;
    pointer-events:none; z-index:0; transition:background .8s ease;
  }
  @keyframes ambient{
    0%,100%{ transform:translate(0,0) scale(1); }
    33%    { transform:translate(3.5%,-2.5%) scale(1.07); }
    66%    { transform:translate(-2.5%,3%) scale(0.95); }
  }
  #video{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;background:transparent;opacity:0;z-index:1;
    transition:opacity .6s cubic-bezier(.2,.8,.3,1);
    filter:brightness(.86) saturate(1.08);
  }
  #video.ready{opacity:1;}
  #video.hidden-bg{opacity:0 !important;}
  #canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2;}

  .hud{
    position:absolute;top:80px;right:22px;
    display:flex;flex-direction:column;align-items:flex-end;gap:6px;
    z-index:12;pointer-events:none;
  }
  .hud-badge{
    display:flex;align-items:center;gap:7px;
    padding:6px 12px;border-radius:10px;
    color:#fff;font-size:11px;font-weight:800;
    letter-spacing:1.2px;
    opacity:0;transform:translateY(-6px);
    transition:opacity .3s ease, transform .3s ease;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .hud-badge.show{opacity:1;transform:translateY(0);}
  .hud-badge.mic{ background:rgba(220,40,40,.88); box-shadow:0 6px 22px rgba(220,40,40,.4); }
  .hud-badge.sys{ background:rgba(34,197,94,.88); box-shadow:0 6px 22px rgba(34,197,94,.4); }
  .hud-badge.bpm{
    background:rgba(15,19,32,.82);
    border:1px solid rgba(255,255,255,.09);
    color:var(--fg);
  }
  .hud-badge.bpm b{ color:var(--c1); font-variant-numeric:tabular-nums; }
  .hud-badge.pitch{
    background:rgba(15,19,32,.82);
    border:1px solid rgba(255,255,255,.09);
    color:var(--fg);
  }
  .hud-badge.pitch b{ color:var(--c2); font-variant-numeric:tabular-nums; }
  .hud-dot{
    width:7px;height:7px;border-radius:50%;background:#fff;
    animation:hudDot 1.1s ease-in-out infinite;
  }
  @keyframes hudDot{
    0%,100%{ opacity:1; transform:scale(1); }
    50%    { opacity:.3; transform:scale(.7); }
  }

  .topbar{position:absolute;top:0;left:0;right:0;padding:18px 20px;z-index:10;pointer-events:none;}
  .brand{
    position:absolute;left:22px;top:20px;
    font-size:13px;font-weight:800;letter-spacing:3px;
    color:rgba(255,255,255,.38);pointer-events:none;
  }
  .brand span{
    background:linear-gradient(135deg,var(--c1),var(--c2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    display:inline-block;animation:brandPulse 4.5s ease-in-out infinite;
  }
  @keyframes brandPulse{
    0%,100%{ filter:drop-shadow(0 0 5px var(--c1-glow)); }
    50%    { filter:drop-shadow(0 0 15px var(--c1-glow)); }
  }
  .modes{
    display:flex;gap:3px;margin:0 auto;width:max-content;padding:5px;
    border-radius:16px;background:rgba(15,19,32,.72);
    backdrop-filter:blur(22px) saturate(1.4);
    -webkit-backdrop-filter:blur(22px) saturate(1.4);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 10px 36px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
    pointer-events:auto;position:relative;
  }
  .modes::after{
    content:'';position:absolute;left:12%;right:12%;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,var(--c1),transparent);
    opacity:.5;transition:background .6s ease;
  }
  .mode-btn{
    padding:9px 17px;border:0;border-radius:12px;
    background:transparent;color:var(--muted);
    font-size:13px;font-family:inherit;font-weight:600;
    cursor:pointer;white-space:nowrap;letter-spacing:.4px;
    transition:color .25s ease, background .25s ease, transform .18s ease;
  }
  .mode-btn:hover:not(.active){color:#fff;background:rgba(255,255,255,.07);}
  .mode-btn:active{ transform:scale(.96); }
  .mode-btn.active{
    background:linear-gradient(135deg,var(--c1),var(--c2));
    color:#04050a;font-weight:800;
    box-shadow:0 4px 22px var(--c1-glow), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .themes{
    position:absolute;right:22px;top:24px;
    display:flex;gap:9px;align-items:center;
    padding:8px 12px;border-radius:14px;
    background:rgba(15,19,32,.72);
    backdrop-filter:blur(22px) saturate(1.4);
    -webkit-backdrop-filter:blur(22px) saturate(1.4);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 10px 36px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
    pointer-events:auto;
  }
  .theme-dot{
    width:24px;height:24px;flex-shrink:0;border-radius:50%;
    border:2px solid rgba(255,255,255,.14);padding:0;cursor:pointer;
    position:relative;
    transition:transform .3s cubic-bezier(.2,.8,.3,1), border-color .25s ease, box-shadow .3s ease;
  }
  .theme-dot:hover{transform:scale(1.18);border-color:rgba(255,255,255,.45);}
  .theme-dot.active{
    border-color:#fff;transform:scale(1.12);
    box-shadow:0 0 0 2px rgba(255,255,255,.12), 0 0 18px rgba(255,255,255,.5);
  }
  .theme-dot.active::after{
    content:'';position:absolute;inset:-5px;border-radius:50%;
    border:1px solid rgba(255,255,255,.28);
    animation:dotRing 2.6s ease-out infinite;
  }
  @keyframes dotRing{
    0%{ transform:scale(.9); opacity:.9; }
    100%{ transform:scale(1.5); opacity:0; }
  }

  /* f(x) 面板 —— 关键修复：show 状态要恢复 pointer-events:auto */
  .fx-panel{
    position:absolute;left:24px;top:68px;
    width:360px;max-width:calc(100vw - 48px);
    padding:14px 16px 15px;border-radius:16px;
    background:rgba(11,15,26,.82);
    backdrop-filter:blur(24px) saturate(1.4);
    -webkit-backdrop-filter:blur(24px) saturate(1.4);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 14px 44px rgba(0,0,0,.58), inset 0 1px 0 rgba(255,255,255,.06);
    z-index:9;
    opacity:0;
    transform:translateY(-14px) scale(.97);
    pointer-events:none;              /* 隐藏时禁用交互 */
    transition:opacity .42s ease, transform .42s cubic-bezier(.2,.8,.3,1);
  }
  .fx-panel.show{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;              /* ★ 修复：显示时允许交互 */
  }
  .fx-panel::before{
    content:'';position:absolute;left:16%;right:16%;top:-1px;height:1px;
    background:linear-gradient(90deg,transparent,var(--c1),transparent);
    opacity:.6;transition:background .6s ease;
  }
  .fx-head{display:flex;align-items:center;gap:7px;margin-bottom:9px;}
  .fx-pulse{
    width:6px;height:6px;border-radius:50%;
    background:var(--c1);box-shadow:0 0 10px var(--c1-glow);
    animation:fxPulse 1.5s ease-in-out infinite;
  }
  @keyframes fxPulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%    { opacity:.35; transform:scale(.7); }
  }
  .fx-title{
    font-size:10px;font-weight:800;letter-spacing:2.4px;
    color:var(--muted);text-transform:uppercase;
  }
  .fx-badge{
    margin-left:auto;font-size:9px;font-weight:700;letter-spacing:1px;
    color:var(--c1);padding:2px 7px;border-radius:5px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.07);
  }
  .fx-graph{
    display:block;width:100%;height:66px;border-radius:9px;
    background:rgba(255,255,255,.025);margin-bottom:10px;
  }
  .fx-formula{
    font-family:'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    font-size:11.5px;font-weight:600;color:#fff;line-height:1.7;
    word-break:break-word;letter-spacing:.1px;min-height:2.4em;
  }
  .fx-formula .num{ color:var(--c1); }
  .fx-formula .fn { color:var(--c2); }
  .fx-formula .ph { color:#f0abfc; }
  .fx-formula .dim{ color:var(--muted); }
  .fx-input-wrap{
    margin-top:10px;padding-top:10px;
    border-top:1px solid rgba(255,255,255,.07);
  }
  .fx-input-row{display:flex;gap:6px;align-items:stretch;}
  .fx-input{
    flex:1;min-width:0;
    padding:8px 11px;border-radius:9px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    color:#fff;font-family:'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    font-size:11.5px;font-weight:600;outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  .fx-input:focus{
    border-color:var(--c1);
    background:rgba(255,255,255,.08);
  }
  .fx-input::placeholder{color:rgba(255,255,255,.3);}
  .fx-input-btn{
    padding:0 12px;border:0;border-radius:9px;
    background:linear-gradient(135deg,var(--c1),var(--c2));
    color:#04050a;font-weight:800;font-size:11px;font-family:inherit;
    cursor:pointer;letter-spacing:.6px;white-space:nowrap;
    transition:.2s ease;
  }
  .fx-input-btn:hover{filter:brightness(1.12);}
  .fx-input-btn.off{
    background:rgba(255,255,255,.08);color:var(--muted);
  }
  .fx-input-hint{
    font-size:10px;color:var(--muted);margin-top:5px;
    letter-spacing:.2px;
  }

  .hint{
    position:absolute;left:50%;bottom:92px;
    transform:translateX(-50%) translateY(10px);
    padding:9px 18px;border-radius:11px;
    background:rgba(13,17,29,.85);
    backdrop-filter:blur(20px) saturate(1.4);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 10px 30px rgba(0,0,0,.6);
    font-size:12px;color:var(--muted);
    letter-spacing:.3px;z-index:11;
    opacity:0;pointer-events:none;
    transition:opacity .5s ease, transform .5s ease;
    white-space:nowrap;
  }
  .hint.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .hint kbd{
    display:inline-block;padding:1px 6px;margin:0 2px;
    font-family:inherit;font-size:11px;font-weight:700;
    color:#fff;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.15);
    border-radius:5px;
  }

  .toast{
    position:fixed;left:50%;top:80px;transform:translateX(-50%);
    padding:11px 20px;border-radius:12px;
    background:rgba(220,50,50,.92);
    color:#fff;font-size:13px;font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    z-index:100;max-width:min(480px, 90vw);text-align:center;
    line-height:1.6;
    animation:toastIn .3s cubic-bezier(.2,.8,.3,1);
  }
  .toast.info{ background:rgba(34,197,94,.92); }
  @keyframes toastIn{
    from{ opacity:0; transform:translateX(-50%) translateY(-10px); }
    to  { opacity:1; transform:translateX(-50%) translateY(0); }
  }

  /* 参数面板 —— 同样确认 show 状态有 pointer-events:auto */
  .params-panel{
    position:absolute;right:24px;top:76px;
    width:300px;max-width:calc(100vw - 48px);
    max-height:calc(100vh - 200px);
    overflow-y:auto;
    padding:16px 18px;
    border-radius:16px;
    background:rgba(11,15,26,.9);
    backdrop-filter:blur(26px) saturate(1.4);
    -webkit-backdrop-filter:blur(26px) saturate(1.4);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 14px 44px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.06);
    z-index:9;
    opacity:0;
    transform:translateX(16px);
    pointer-events:none;
    transition:opacity .42s ease, transform .42s cubic-bezier(.2,.8,.3,1);
  }
  .params-panel.show{
    opacity:1;
    transform:translateX(0);
    pointer-events:auto;              /* ★ 关键 */
  }
  .params-panel::-webkit-scrollbar{width:6px;}
  .params-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px;}
  .pp-title{
    display:flex;align-items:center;gap:8px;
    font-size:10px;font-weight:800;letter-spacing:2.4px;
    color:var(--muted);text-transform:uppercase;
    margin-bottom:14px;
    padding-bottom:11px;
    border-bottom:1px solid rgba(255,255,255,.07);
  }
  .pp-title svg{color:var(--c1);}
  .pp-row{margin-bottom:14px;}
  .pp-row:last-of-type{margin-bottom:6px;}
  .pp-label{
    display:flex;justify-content:space-between;
    font-size:11.5px;font-weight:600;
    color:#c9d2e0;letter-spacing:.3px;
    margin-bottom:6px;
  }
  .pp-val{
    color:var(--c1);font-family:'SF Mono', ui-monospace, monospace;
    font-variant-numeric:tabular-nums;
  }
  .pp-range{
    -webkit-appearance:none;appearance:none;
    width:100%;height:4px;border-radius:99px;
    background:rgba(255,255,255,.14);
    outline:none;cursor:pointer;
  }
  .pp-range::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px;height:13px;border-radius:50%;
    background:#fff;
    box-shadow:0 0 0 3px var(--c1-glow),0 2px 8px rgba(0,0,0,.6);
    transition:transform .15s ease;
  }
  .pp-range::-webkit-slider-thumb:hover{transform:scale(1.18);}
  .pp-range::-moz-range-thumb{
    width:13px;height:13px;border:0;border-radius:50%;
    background:#fff;box-shadow:0 0 0 3px var(--c1-glow);
  }
  .pp-reset{
    display:block;width:100%;
    padding:10px;margin-top:14px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;
    background:rgba(255,255,255,.05);
    color:var(--muted);font-size:11.5px;font-weight:700;
    font-family:inherit;letter-spacing:1px;cursor:pointer;
    transition:.2s ease;
  }
  .pp-reset:hover{color:#fff;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);}
  .pp-section{
    font-size:9.5px;font-weight:800;letter-spacing:1.6px;
    color:var(--muted);text-transform:uppercase;
    margin:16px 0 10px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,.05);
  }

  .progress-wrap{
    position:absolute;left:50%;bottom:78px;
    transform:translateX(-50%) translateY(8px);
    width:min(1160px, calc(100% - 20px));
    height:26px;
    border-radius:8px;
    overflow:hidden;
    background:rgba(13,17,29,.7);
    border:1px solid rgba(255,255,255,.06);
    z-index:9;
    opacity:0;pointer-events:none;
    transition:opacity .4s ease, transform .4s ease;
  }
  .progress-wrap.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #waveProgress{display:block;width:100%;height:100%;}

  .controls{
    position:absolute;left:50%;bottom:26px;
    transform:translateX(-50%) translateY(16px);
    width:min(1180px, calc(100% - 16px));
    display:flex;align-items:center;gap:6px;padding:11px 14px;
    border-radius:20px;background:rgba(13,17,29,.78);
    backdrop-filter:blur(26px) saturate(1.4);
    -webkit-backdrop-filter:blur(26px) saturate(1.4);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 16px 50px rgba(0,0,0,.68), inset 0 1px 0 rgba(255,255,255,.07);
    z-index:10;opacity:0;pointer-events:none;
    transition:opacity .5s ease, transform .5s cubic-bezier(.2,.8,.3,1);
  }
  .controls.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
  .controls::before{
    content:'';position:absolute;left:15%;right:15%;top:-1px;height:1px;
    background:linear-gradient(90deg,transparent,var(--c1),transparent);
    opacity:.45;
  }
  .btn{
    display:grid;place-items:center;width:34px;height:34px;flex-shrink:0;
    border:1px solid rgba(255,255,255,.06);border-radius:11px;
    background:rgba(255,255,255,.06);color:#fff;cursor:pointer;
    position:relative;
    transition:background .2s ease, transform .15s ease, box-shadow .25s ease, border-color .2s ease;
  }
  .btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.18);box-shadow:0 0 18px rgba(255,255,255,.1);}
  .btn:active{ transform:scale(.93); }
  .btn.on{
    background:linear-gradient(135deg,var(--c1),var(--c2));
    color:#04050a;border-color:transparent;
    box-shadow:0 4px 20px var(--c1-glow);
  }
  .btn.mic.on{
    background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;
    box-shadow:0 4px 20px rgba(239,68,68,.55);
  }
  .btn.sys.on{
    background:linear-gradient(135deg,#22c55e,#06b6d4);color:#fff;
    box-shadow:0 4px 20px rgba(34,197,94,.55);
  }
  .btn.midi.on{
    background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;
    box-shadow:0 4px 20px rgba(168,85,247,.55);
  }
  .btn.primary{
    width:44px;height:44px;border-radius:14px;
    background:linear-gradient(135deg,var(--c1),var(--c2));
    color:#04050a;border-color:transparent;
    box-shadow:0 5px 24px var(--c1-glow), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .btn.primary:hover{ filter:brightness(1.12); transform:scale(1.04); }
  .btn.primary:active{ transform:scale(.96); }
  .fx-label{
    font-family:'Times New Roman', Georgia, 'Songti SC', serif;
    font-style:italic;font-weight:700;font-size:13px;
    letter-spacing:.5px;line-height:1;transform:translateY(-.5px);
  }
  .time{
    font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
    min-width:36px;text-align:center;flex-shrink:0;
    font-weight:600;letter-spacing:.3px;
  }
  #durTime{ min-width:42px; }
  input[type=range]{
    -webkit-appearance:none;appearance:none;height:4px;border-radius:99px;
    background:rgba(255,255,255,.15);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:#fff;box-shadow:0 0 0 3px var(--c1-glow),0 2px 8px rgba(0,0,0,.7);
    transition:transform .16s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover{ transform:scale(1.22); }
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border:0;border-radius:50%;
    background:#fff;box-shadow:0 0 0 3px var(--c1-glow);
  }
  #seek{flex:1;min-width:40px;}
  #vol{width:54px;flex-shrink:0;}

  .drop{
    position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:24px;
    transition:opacity .5s ease, visibility .5s;
  }
  .drop.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  .drop-card{
    width:min(480px,100%);padding:44px 34px 38px;border-radius:28px;
    text-align:center;background:rgba(15,20,34,.6);
    backdrop-filter:blur(20px) saturate(1.3);
    -webkit-backdrop-filter:blur(20px) saturate(1.3);
    border:1.5px dashed rgba(255,255,255,.16);
    box-shadow:0 24px 70px rgba(0,0,0,.5);
    transition:.35s cubic-bezier(.2,.8,.3,1);cursor:pointer;
    position:relative;overflow:hidden;
  }
  .drop-card::before{
    content:'';position:absolute;inset:-50%;
    background:conic-gradient(from 0deg,transparent,var(--c1-glow),transparent 30%);
    animation:spinSlow 6s linear infinite;opacity:.5;pointer-events:none;
  }
  @keyframes spinSlow{ to{ transform:rotate(360deg); } }
  .drop-card > *{ position:relative; z-index:1; }
  .drop-card:hover{
    border-color:rgba(255,255,255,.32);background:rgba(20,28,48,.68);
    transform:translateY(-4px);
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 60px var(--c1-glow);
  }
  .drop-card.over{
    border-color:var(--c1);background:rgba(20,30,52,.8);
    transform:scale(1.03);box-shadow:0 0 80px var(--c1-glow);
  }
  .drop-icon{
    width:80px;height:80px;margin:0 auto 24px;display:grid;place-items:center;
    border-radius:26px;
    background:linear-gradient(135deg,var(--c1-glow),var(--c2-glow));
    border:1px solid rgba(255,255,255,.12);color:var(--c1);
    animation:float 3.6s ease-in-out infinite;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
  }
  @keyframes float{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%    { transform:translateY(-9px) rotate(3deg); }
  }
  .drop-card h2{font-size:20px;font-weight:700;margin-bottom:10px;letter-spacing:.5px;}
  .drop-card p{font-size:13px;color:var(--muted);line-height:1.75;margin-bottom:22px;}
  .pick-btn{
    padding:13px 38px;border:0;border-radius:14px;
    background:linear-gradient(135deg,var(--c1),var(--c2));
    color:#04050a;font-size:14px;font-weight:800;font-family:inherit;
    cursor:pointer;letter-spacing:.8px;
    box-shadow:0 8px 30px var(--c1-glow), inset 0 1px 0 rgba(255,255,255,.4);
    transition:.22s ease;
  }
  .pick-btn:hover{ filter:brightness(1.12); transform:translateY(-2px); }
  .pick-btn:active{ transform:translateY(0) scale(.97); }

  .extra-links{
    display:flex;justify-content:center;gap:4px;margin-top:14px;
    flex-wrap:wrap;
  }
  .extra-link{
    background:none;border:0;
    color:var(--muted);font-family:inherit;
    font-size:12px;font-weight:600;letter-spacing:.4px;
    cursor:pointer;padding:7px 12px;border-radius:9px;
    transition:.2s ease;
    display:inline-flex;align-items:center;gap:5px;
  }
  .extra-link:hover{color:#fff;background:rgba(255,255,255,.06);}

  @media (max-width:1000px){ .brand{ display:none; } }
  @media (max-width:820px){
    .topbar{ padding:12px 10px; }
    .modes{ padding:4px; border-radius:14px; }
    .mode-btn{ padding:8px 12px; font-size:12px; }
    .themes{ right:10px; top:14px; padding:6px 9px; gap:7px; border-radius:12px; }
    .theme-dot{ width:20px; height:20px; }
    .controls{ gap:4px; padding:9px 10px; bottom:14px; border-radius:17px; }
    .btn{ width:29px; height:29px; border-radius:9px; }
    .btn.primary{ width:38px; height:38px; border-radius:12px; }
    .time{ font-size:10.5px; min-width:28px; }
    #vol{ width:38px; }
    .fx-panel{ left:12px; top:58px; width:min(320px, calc(100vw - 24px)); padding:12px 13px 13px; border-radius:14px; }
    .fx-graph{ height:54px; }
    .fx-formula{ font-size:10.5px; }
    .fx-input{ font-size:10.5px; }
    .params-panel{ right:10px; top:60px; width:min(270px, calc(100vw - 20px)); padding:13px 15px; }
    .hint{ font-size:10px; padding:6px 10px; bottom:78px; }
    .hud{ top:58px; right:10px; }
    .hud-badge{ font-size:9.5px; padding:5px 9px; }
    .progress-wrap{ bottom:64px; height:20px; width:calc(100% - 16px); }
    .drop-card{ padding:34px 22px 30px; border-radius:24px; }
    .drop-card h2{ font-size:17px; }
    .drop-icon{ width:66px; height:66px; border-radius:22px; }
  }
  @media (max-width:640px){
    #homeBtn, #bloomBtn, #loopBtn, #midiBtn, #stereoBtn{ display:none; }
    .themes{ gap:5px; padding:5px 8px; }
    .theme-dot{ width:18px; height:18px; }
    #vol{ display:none; }
    .mode-btn{ padding:7px 10px; font-size:11.5px; }
    .btn{ width:27px; height:27px; }
    .btn.primary{ width:36px; height:36px; }
  }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>

  <div class="topbar">
    <div class="brand">音<span>波</span> · VISUALIZER</div>
    <div class="modes" id="modes">
      <button class="mode-btn active" data-mode="bars">频谱柱</button>
      <button class="mode-btn" data-mode="circle">环形波</button>
      <button class="mode-btn" data-mode="wave">波形线</button>
      <button class="mode-btn" data-mode="particles">粒子</button>
    </div>
    <div class="themes" id="themes"></div>
  </div>

  <div class="hud" id="hud">
    <div class="hud-badge" id="srcLive">
      <span class="hud-dot"></span> <span id="srcLiveText">LIVE</span>
    </div>
    <div class="hud-badge bpm" id="bpmBadge">
      BPM <b id="bpmVal">—</b>
    </div>
    <div class="hud-badge pitch" id="pitchBadge">
      PITCH <b id="pitchVal">—</b>
    </div>
  </div>

  <div class="fx-panel" id="fxPanel">
    <div class="fx-head">
      <span class="fx-pulse"></span>
      <span class="fx-title">实时谐波分解</span>
      <span class="fx-badge" id="fxBadge">REAL</span>
    </div>
    <canvas class="fx-graph" id="fxGraph"></canvas>
    <div class="fx-formula" id="fxFormula">f(x) = 0</div>
    <div class="fx-input-wrap">
      <div class="fx-input-row">
        <input class="fx-input" id="fxInput" type="text" placeholder="sin(x)+0.5*sin(3*x)" spellcheck="false" autocomplete="off">
        <button class="fx-input-btn off" id="fxApplyBtn">应用</button>
      </div>
      <div class="fx-input-hint">回车应用 · 再点按钮切回音频驱动</div>
    </div>
  </div>

  <div class="params-panel" id="paramsPanel">
    <div class="pp-title">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      参数调整
    </div>
    <div class="pp-section">可视化</div>
    <div class="pp-row">
      <div class="pp-label"><span>柱状图数量</span><span class="pp-val" id="pvBars">72</span></div>
      <input class="pp-range" id="prBars" type="range" min="16" max="192" step="4" value="72">
    </div>
    <div class="pp-row">
      <div class="pp-label"><span>环形波数量</span><span class="pp-val" id="pvCircle">128</span></div>
      <input class="pp-range" id="prCircle" type="range" min="32" max="256" step="8" value="128">
    </div>
    <div class="pp-row">
      <div class="pp-label"><span>波形平滑度</span><span class="pp-val" id="pvWave">0.35</span></div>
      <input class="pp-range" id="prWave" type="range" min="0.1" max="0.8" step="0.05" value="0.35">
    </div>
    <div class="pp-row">
      <div class="pp-label"><span>粒子密度</span><span class="pp-val" id="pvPtc">9</span></div>
      <input class="pp-range" id="prPtc" type="range" min="1" max="20" step="1" value="9">
    </div>
    <div class="pp-section">特效</div>
    <div class="pp-row">
      <div class="pp-label"><span>节拍灵敏度</span><span class="pp-val" id="pvBeat">1.38</span></div>
      <input class="pp-range" id="prBeat" type="range" min="1.05" max="2.2" step="0.02" value="1.38">
    </div>
    <div class="pp-row">
      <div class="pp-label"><span>泛光强度</span><span class="pp-val" id="pvBloom">0.36</span></div>
      <input class="pp-range" id="prBloom" type="range" min="0" max="0.7" step="0.02" value="0.36">
    </div>
    <div class="pp-row">
      <div class="pp-label"><span>泛光半径</span><span class="pp-val" id="pvBlur">9</span></div>
      <input class="pp-range" id="prBlur" type="range" min="2" max="20" step="1" value="9">
    </div>
    <button class="pp-reset" id="ppReset">恢复默认</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <canvas id="waveProgress"></canvas>
  </div>

  <div class="hint" id="hint">
    <kbd>空格</kbd>播放 · <kbd>M</kbd>麦克风 · <kbd>S</kbd>系统音频 · <kbd>B</kbd>背景 · <kbd>F</kbd>函数 · <kbd>Esc</kbd>返回
  </div>

  <div class="controls" id="controls">
    <button class="btn" id="openBtn" title="打开文件">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
      </svg>
    </button>
    <button class="btn primary" id="playBtn" title="播放 / 暂停"></button>
    <span class="time" id="curTime">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" step="1">
    <span class="time" id="durTime">-0:00</span>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
    <button class="btn" id="loopBtn" title="循环 (L)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
        <path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>
      </svg>
    </button>
    <button class="btn on" id="beatBtn" title="节拍脉冲 (K)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h3l2-7 4 14 2-7h7"/>
      </svg>
    </button>
    <button class="btn on" id="bloomBtn" title="泛光 (O)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2 M12 20v2 M2 12h2 M20 12h2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
    <button class="btn" id="stereoBtn" title="立体声分离 (T)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h4l2-6 4 12 2-6h6"/>
      </svg>
    </button>
    <button class="btn" id="midiBtn" title="MIDI 输出 (I)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="6" width="18" height="12" rx="2"/>
        <line x1="8" y1="10" x2="8" y2="14"/>
        <line x1="12" y1="10" x2="12" y2="14"/>
        <line x1="16" y1="10" x2="16" y2="14"/>
      </svg>
    </button>
    <button class="btn mic" id="micBtn" title="麦克风 (M)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10v1a7 7 0 0 0 14 0v-1"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
    </button>
    <button class="btn sys" id="sysBtn" title="系统音频 (S)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="13" rx="2"/>
        <line x1="8" y1="20" x2="16" y2="20"/>
        <line x1="12" y1="17" x2="12" y2="20"/>
      </svg>
    </button>
    <button class="btn" id="fxBtn" title="f(x) 函数 (F)">
      <span class="fx-label">ƒ(x)</span>
    </button>
    <button class="btn" id="paramsBtn" title="参数调整 (P)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="21" x2="4" y2="14"/>
        <line x1="4" y1="10" x2="4" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12" y2="3"/>
        <line x1="20" y1="21" x2="20" y2="16"/>
        <line x1="20" y1="12" x2="20" y2="3"/>
        <line x1="1" y1="14" x2="7" y2="14"/>
        <line x1="9" y1="8" x2="15" y2="8"/>
        <line x1="17" y1="16" x2="23" y2="16"/>
      </svg>
    </button>
    <button class="btn on" id="bgBtn" title="背景 (B)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 6.5A2.5 2.5 0 0 1 4.5 4h9A2.5 2.5 0 0 1 16 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 2 17.5z"/>
        <path d="m22 8-6 4 6 4z"/>
      </svg>
    </button>
    <button class="btn" id="shareBtn" title="复制分享链接 (Ctrl+Shift+C)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/>
        <circle cx="6" cy="12" r="3"/>
        <circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
    </button>
    <button class="btn" id="homeBtn" title="返回主页 (Esc)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </button>
  </div>

  <div class="drop" id="drop">
    <div class="drop-card" id="dropCard">
      <div class="drop-icon">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <h2>拖入视频或音频文件</h2>
      <p>支持 MP4 · WebM · MOV · MP3 · WAV · M4A · FLAC 等</p>
      <button class="pick-btn" id="pickBtn">选择文件</button>
      <div class="extra-links">
        <button class="extra-link" id="micLink">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M5 10v1a7 7 0 0 0 14 0v-1"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
          麦克风
        </button>
        <button class="extra-link" id="sysLink">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="13" rx="2"/>
            <line x1="8" y1="20" x2="16" y2="20"/>
            <line x1="12" y1="17" x2="12" y2="20"/>
          </svg>
          系统音频
        </button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="video/*,audio/*" hidden>

<script>
(function(){
  'use strict';

  const CONFIG = {
    mainFft: 2048,
    fxFft:   8192,
    wave: { follow: 0.35, pointsDiv: 2.6, pointsMin: 140, pointsMax: 420 },
    fft: {
      maxPeaks: 6, peakThreshold: 0.008,
      parabolaInterp: true, freqMin: 45, freqMax: 11000
    },
    bars:   { count: 72,  fmin: 40, fmax: 16000 },
    circle: { count: 128, fmin: 40, fmax: 16000 },
    beat: {
      enabled: true, threshold: 1.38, minLevel: 0.14,
      minGapMs: 130, historyLen: 42, decay: 0.87,
      zoom: 0.038, flash: 0.045
    },
    bloom: { enabled: true, alpha: 0.36, blur: 9 },
    particles: { maxHigh: 1100, maxLow: 380, bassRate: 9, midRate: 3 },
    adaptiveQuality: true,
    stereo: false,
    midiEnabled: false,
    midiChannel: 1,
    midiNote: 60,
    pitchEnabled: true,
    customFormula: null,
    customFormulaOn: false
  };

  const THEMES = {
    aurora: { name:'极光', c1:'#22d3ee', c2:'#a855f7',
      stops:['#22d3ee','#818cf8','#c084fc','#ec4899'] },
    fire:   { name:'烈焰', c1:'#ff7a18', c2:'#ffd60a',
      stops:['#ff2d55','#ff7a18','#ffb703','#ffe066'] },
    ocean:  { name:'深海', c1:'#38bdf8', c2:'#4f46e5',
      stops:['#67e8f9','#38bdf8','#3b82f6','#6366f1'] },
    neon:   { name:'霓虹', c1:'#22c55e', c2:'#06b6d4',
      stops:['#a3e635','#22c55e','#14b8a6','#06b6d4'] },
    sunset: { name:'日落', c1:'#fb923c', c2:'#e11d48',
      stops:['#fbbf24','#fb923c','#f43f5e','#a855f7'] },
    mono:   { name:'月白', c1:'#e2e8f0', c2:'#94a3b8',
      stops:['#ffffff','#e2e8f0','#cbd5e1','#94a3b8'] }
  };
  function hexToRgb(h){
    h = h.replace('#','');
    if (h.length === 3) h = h.split('').map(c=>c+c).join('');
    const n = parseInt(h,16);
    return [(n>>16)&255,(n>>8)&255,n&255];
  }
  function hexToRgba(h,a){
    const c = hexToRgb(h);
    return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
  }
  Object.keys(THEMES).forEach(k=>{ THEMES[k].rgbStops = THEMES[k].stops.map(hexToRgb); });
  function sampleRgb(theme, t){
    const s = theme.rgbStops, n = s.length - 1;
    let ft = t < 0 ? 0 : (t > 1 ? 1 : t);
    ft *= n;
    let i = Math.floor(ft);
    if (i >= n) i = n - 1;
    const f = ft - i, a = s[i], b = s[i+1];
    return [ a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f ];
  }
  function rgbStr(c,a){ return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')'; }
  let currentTheme = THEMES.aurora;

  const TAU = Math.PI * 2;
  const MAIN_FFT = CONFIG.mainFft;
  const FX_FFT = CONFIG.fxFft;

  const stage    = document.getElementById('stage');
  const video    = document.getElementById('video');
  const canvas   = document.getElementById('canvas');
  const ctx      = canvas.getContext('2d', { alpha: true });
  const dropEl   = document.getElementById('drop');
  const dropCard = document.getElementById('dropCard');
  const fileInput= document.getElementById('fileInput');
  const controls = document.getElementById('controls');
  const playBtn  = document.getElementById('playBtn');
  const openBtn  = document.getElementById('openBtn');
  const seekEl   = document.getElementById('seek');
  const volEl    = document.getElementById('vol');
  const curEl    = document.getElementById('curTime');
  const durEl    = document.getElementById('durTime');
  const themesEl = document.getElementById('themes');
  const bgBtn    = document.getElementById('bgBtn');
  const fxBtn    = document.getElementById('fxBtn');
  const loopBtn  = document.getElementById('loopBtn');
  const homeBtn  = document.getElementById('homeBtn');
  const beatBtn  = document.getElementById('beatBtn');
  const bloomBtn = document.getElementById('bloomBtn');
  const micBtn   = document.getElementById('micBtn');
  const sysBtn   = document.getElementById('sysBtn');
  const stereoBtn= document.getElementById('stereoBtn');

  /* 主线程 FFT（直接跑，不用 Worker） */
  function fftInPlace(re, im){
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++){
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j){
        let t = re[i]; re[i] = re[j]; re[j] = t;
        t = im[i]; im[i] = im[j]; im[j] = t;
      }
    }
    for (let len = 2; len <= n; len <<= 1){
      const half = len >> 1;
      const ang = -2 * Math.PI / len;
      const wR = Math.cos(ang), wI = Math.sin(ang);
      for (let i = 0; i < n; i += len){
        let cR = 1, cI = 0;
        for (let j = 0; j < half; j++){
          const uR = re[i+j], uI = im[i+j];
          const xR = re[i+j+half], xI = im[i+j+half];
          const vR = xR * cR - xI * cI;
          const vI = xR * cI + xI * cR;
          re[i+j]      = uR + vR;
          im[i+j]      = uI + vI;
          re[i+j+half] = uR - vR;
          im[i+j+half] = uI - vI;
          const nR = cR * wR - cI * wI;
          const nI = cR * wI + cI * wR;
          cR = nR; cI = nI;
        }
      }
    }
  }

  const fxRe = new Float32Array(FX_FFT);
  const fxIm = new Float32Array(FX_FFT);
  function computeFxFFT(){
    const n = FX_FFT;
    for (let i = 0; i < n; i++){
      fxRe[i] = (fxTimeData[i] - 128) / 128 * fxWin[i];
      fxIm[i] = 0;
    }
    fftInPlace(fxRe, fxIm);
    const half = n >> 1;
    const scale = 4 / n;
    for (let k = 0; k < half; k++){
      const r = fxRe[k], im2 = fxIm[k];
      fxMag[k] = Math.sqrt(r*r + im2*im2) * scale;
      const p = Math.atan2(im2, r);
      let d = p - fxPrevPhase[k];
      if (d > Math.PI) d -= Math.PI * 2;
      else if (d < -Math.PI) d += Math.PI * 2;
      fxUnwrappedPhase[k] += d;
      fxPrevPhase[k] = p;
      fxPhase[k] = p;
    }
  }

    const ch = CONFIG.midiChannel - 1;

  function rebuildArrays(){

  /* ================= 麦克风 / 系统音频 ================= */
  async function enableMic(){
    if (currentSource === 'mic') return;
    try {
      initAudio(); resumeAudio();
      if (!micStream ||
          micStream.getAudioTracks().length === 0 ||
          micStream.getAudioTracks()[0].readyState === 'ended'){
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
          throw new Error('当前浏览器不支持麦克风输入');
        }
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        const track = micStream.getAudioTracks()[0];
        if (track) track.onended = () => {
          if (currentSource === 'mic'){ disableToVideo(); showToast('麦克风已断开'); }
        };
      }
      if (!micSource){
        micSource = audioCtx.createMediaStreamSource(micStream);
        micMainA = createAnalyser(MAIN_FFT);
        micFxA   = createAnalyser(FX_FFT);
        micMainAL = createAnalyser(MAIN_FFT);
        micMainAR = createAnalyser(MAIN_FFT);
        const sp = audioCtx.createChannelSplitter(2);
        micSource.connect(sp);
        sp.connect(micMainAL, 0);
        sp.connect(micMainAR, 1);
        micSource.connect(micMainA);
        micSource.connect(micFxA);
      }
      currentSource = 'mic';
      setSourceAnalysers();
      updateSrcLive();
      micBtn.classList.add('on');
      sysBtn.classList.remove('on');
      dropEl.classList.add('hidden');
      controls.classList.add('show');
      video.classList.remove('ready');
      playBtn.innerHTML = ICON_PLAY;
      resetVisualState();
      showToast('麦克风已开启', true);
    } catch (err){
      console.warn('Mic error:', err);
      let msg = '无法访问麦克风';
      if (err && err.name === 'NotAllowedError') msg = '麦克风权限被拒绝';
      else if (err && err.name === 'NotFoundError') msg = '未找到麦克风设备';
      else if (err && err.name === 'NotReadableError') msg = '麦克风被其他程序占用';
      else if (err && err.message) msg = err.message;
      showToast(msg);
    }
  }

  async function enableSys(){
    if (currentSource === 'sys') return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
      showToast('当前浏览器不支持系统音频捕获（需 Chrome / Edge 等）');
      return;
    }
    try {
      initAudio(); resumeAudio();
      sysStream = await navigator.mediaDevices.getDisplayMedia({
        video: true,
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      sysStream.getVideoTracks().forEach(t => { t.stop(); });
      const audioTracks = sysStream.getAudioTracks();
      if (audioTracks.length === 0){
        showToast('没有捕获到音频。<br>请在共享对话框底部勾选「<b>分享音频</b>」后重试。');
        sysStream.getTracks().forEach(t => t.stop());
        sysStream = null;
        return;
      }
      audioTracks[0].onended = () => {
        if (currentSource === 'sys'){ disableToVideo(); showToast('系统音频已断开'); }
      };
      if (sysSource) { try { sysSource.disconnect(); } catch(e){} }
      sysSource = audioCtx.createMediaStreamSource(sysStream);
      if (!sysMainA){
        sysMainA = createAnalyser(MAIN_FFT);
        sysFxA = createAnalyser(FX_FFT);
        sysMainAL = createAnalyser(MAIN_FFT);
        sysMainAR = createAnalyser(MAIN_FFT);
      }
      const sp = audioCtx.createChannelSplitter(2);
      sysSource.connect(sp);
      sp.connect(sysMainAL, 0);
      sp.connect(sysMainAR, 1);
      sysSource.connect(sysMainA);
      sysSource.connect(sysFxA);
      currentSource = 'sys';
      setSourceAnalysers();
      updateSrcLive();
      sysBtn.classList.add('on');
      micBtn.classList.remove('on');
      dropEl.classList.add('hidden');
      controls.classList.add('show');
      video.classList.remove('ready');
      playBtn.innerHTML = ICON_PLAY;
      resetVisualState();
      const isMac = navigator.platform.toLowerCase().indexOf('mac') >= 0;
      if (isMac) showToast('已捕获系统音频（macOS 只能捕获标签页声音）', true);
      else showToast('已捕获系统音频', true);
    } catch (err){
      console.warn('Sys audio error:', err);
      let msg = '无法捕获系统音频';
      if (err && err.name === 'NotAllowedError') msg = '共享被取消或被拒绝';
      else if (err && err.name === 'NotSupportedError') msg = '当前浏览器/系统不支持系统音频';
      else if (err && err.message) msg = err.message;
      showToast(msg);
      if (sysStream){ sysStream.getTracks().forEach(t => t.stop()); sysStream = null; }
    }
  }

  function createAnalyser(fftSize){
    const a = audioCtx.createAnalyser();
    a.fftSize = fftSize;
    a.smoothingTimeConstant = 0.72;
    a.minDecibels = -95;
    a.maxDecibels = -22;
    return a;
  }

  function setSourceAnalysers(){
    if (currentSource === 'mic'){
      mainAnalyser = micMainA; mainAL = micMainAL; mainAR = micMainAR; fxAnalyser = micFxA;
    } else if (currentSource === 'sys'){
      mainAnalyser = sysMainA; mainAL = sysMainAL; mainAR = sysMainAR; fxAnalyser = sysFxA;
    } else {
      mainAnalyser = videoMainA; mainAL = videoMainAL; mainAR = videoMainAR; fxAnalyser = videoFxA;
    }
  }

  function initAudio(){
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    try {
      srcNode = audioCtx.createMediaElementSource(video);
      videoMainA = createAnalyser(MAIN_FFT);
      videoFxA   = createAnalyser(FX_FFT);
      videoMainAL = createAnalyser(MAIN_FFT);
      videoMainAR = createAnalyser(MAIN_FFT);
      splitter = audioCtx.createChannelSplitter(2);
      srcNode.connect(splitter);
      splitter.connect(videoMainAL, 0);
      splitter.connect(videoMainAR, 1);
      srcNode.connect(videoMainA);
      srcNode.connect(videoFxA);
      videoMainA.connect(audioCtx.destination);
    } catch(e){
      console.warn('Video audio init failed:', e);
    }
    setSourceAnalysers();
  }
  function resumeAudio(){
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});

  function resize(){
    const r = stage.getBoundingClientRect();
    W = Math.max(1, r.width);
    H = Math.max(1, r.height);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bloomCanvas.width  = Math.max(1, Math.round(canvas.width / 2));
    bloomCanvas.height = Math.max(1, Math.round(canvas.height / 2));
    wavePts = null;
    const wp = waveProgress.parentElement.getBoundingClientRect();
    waveProgress.width = Math.round(wp.width * DPR);
    waveProgress.height = Math.round(wp.height * DPR);
    wpCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (progressPeaks) drawProgress();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  function roundRect(c, x, y, w, h, r){
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y,     x + w, y + h, r);
    c.arcTo(x + w, y + h, x,     y + h, r);
    c.arcTo(x,     y + h, x,     y,     r);
    c.arcTo(x,     y,     x + w, y,     r);
    c.closePath();
  }
  function getBass(){
    if (!mainFreqData) return 0;
    let s = 0;
    const n = Math.min(24, mainFreqData.length);
    for (let i = 0; i < n; i++) s += mainFreqData[i];
    return Math.min(1, s / (n * 255) * 1.9);
  }
  function getMid(){
    if (!mainFreqData) return 0;
    const a = 24;
    const b = Math.min(140, mainFreqData.length);
    let s = 0;
    for (let i = a; i < b; i++) s += mainFreqData[i];
    return Math.min(1, s / ((b - a) * 255) * 2.3);
  }
  function bandValues(out, fmin, fmax){
    if (!mainFreqData) { out.fill(0); return; }
    const sr = audioCtx ? audioCtx.sampleRate : 44100;
    const binHz = sr / MAIN_FFT;
    const N = out.length;
    const logMin = Math.log(fmin);
    const logRange = Math.log(fmax / fmin);
    const maxBin = mainFreqData.length;
    for (let i = 0; i < N; i++){
      const t0 = i / N, t1 = (i + 1) / N;
      const f0 = Math.exp(logMin + logRange * t0);
      const f1 = Math.exp(logMin + logRange * t1);
      let s0 = Math.max(0, Math.round(f0 / binHz));
      let s1 = Math.min(maxBin - 1, Math.round(f1 / binHz));
      if (s1 <= s0) s1 = s0 + 1;
      let sum = 0;
      for (let j = s0; j < s1; j++) sum += mainFreqData[j];
      let v = sum / (s1 - s0) / 255;
      v *= 1.25 + t0 * 1.1;
      if (v > 1) v = 1;
      const prev = out[i];
      const k = v > prev ? 0.62 : 0.14;
      out[i] = prev + (v - prev) * k;
    }
  }

  function updateBeat(){
    if (!beatOn){
      beatPulse *= 0.88;
      if (beatPulse < 0.005) beatPulse = 0;
      return;
    }
    const inst = getBass();
    const L = bassHist.length;
    if (bassHistCount < L) bassHistCount++;
    else bassHistSum -= bassHist[bassHistIdx];
    bassHist[bassHistIdx] = inst;
    bassHistSum += inst;
    bassHistIdx = (bassHistIdx + 1) % L;
    const avg = bassHistSum / Math.max(1, bassHistCount);
    const now = performance.now();
    if (inst > avg * CONFIG.beat.threshold &&
        inst > CONFIG.beat.minLevel &&
        now - lastBeatMs > CONFIG.beat.minGapMs){
      beatPulse = 1.0;
      lastBeatMs = now;
      beatTimes.push(now);
      if (beatTimes.length > 10) beatTimes.shift();
      if (beatTimes.length >= 4){
        let sum = 0;
        for (let i = 1; i < beatTimes.length; i++) sum += beatTimes[i] - beatTimes[i-1];
        const avgInterval = sum / (beatTimes.length - 1);
        let b = 60000 / avgInterval;
        while (b < 60) b *= 2;
        while (b > 180) b /= 2;
        bpm = Math.round(b);
        bpmVal.textContent = bpm;
        bpmBadge.classList.add('show');
      }
      if (CONFIG.midiEnabled){
        const vel = Math.min(127, Math.max(30, Math.round(inst * 160)));
        sendMidiNote(vel);
      }
    } else {
      beatPulse *= CONFIG.beat.decay;
      if (beatPulse < 0.005) beatPulse = 0;
    }
  }

  function updatePitch(){
    if (!CONFIG.pitchEnabled) return;
    pitchTick++;
    if (pitchTick % 8 !== 0) return;
    if (currentSource === 'video' && (video.paused || video.ended)) return;
    const src = mainTimeData;
    const SIZE = Math.min(1024, src.length);
    let rms = 0;
    for (let i = 0; i < SIZE; i++){
      const v = (src[i] - 128) / 128;
      rms += v * v;
    }
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.008){
      pitchVal.textContent = '—';
      pitchBadge.classList.remove('show');
      return;
    }
    const c = new Float32Array(SIZE);
    for (let lag = 0; lag < SIZE; lag++){
      let s = 0;
      for (let i = 0; i < SIZE - lag; i++){
        s += (src[i] - 128) * (src[i + lag] - 128);
      }
      c[lag] = s;
    }
    let d = 0;
    while (d < SIZE - 1 && c[d] > c[d + 1]) d++;
    let maxval = -1, maxpos = -1;
    for (let i = d; i < SIZE; i++){
      if (c[i] > maxval){ maxval = c[i]; maxpos = i; }
    }
    if (maxpos <= 0){
      pitchVal.textContent = '—';
      return;
    }
    const x1 = c[maxpos - 1], x2 = c[maxpos], x3 = c[maxpos + 1];
    const a2 = (x1 + x3 - 2 * x2) / 2;
    const b2 = (x3 - x1) / 2;
    let T0 = maxpos;
    if (Math.abs(a2) > 1e-9) T0 = maxpos - b2 / (2 * a2);
    const sr = audioCtx ? audioCtx.sampleRate : 44100;
    const hz = sr / T0;
    if (hz < 60 || hz > 1200){
      pitchVal.textContent = '—';
      pitchBadge.classList.remove('show');
      return;
    }
    pitchHz = hz;
    pitchVal.textContent = hz.toFixed(1) + ' Hz';
    pitchBadge.classList.add('show');
  }

  function applyBloom(){
    if (!bloomOn) return;
    const bw = bloomCanvas.width, bh = bloomCanvas.height;
    bloomCtx.clearRect(0, 0, bw, bh);
    bloomCtx.drawImage(canvas, 0, 0, bw, bh);
    const blurR = (CONFIG.bloom.blur + beatPulse * 5) * 0.5;
    const alpha = CONFIG.bloom.alpha + beatPulse * 0.18;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.filter = 'blur(' + blurR.toFixed(1) + 'px)';
    ctx.globalAlpha = Math.min(0.85, alpha);
    ctx.drawImage(bloomCanvas, 0, 0, bw, bh, 0, 0, W, H);
    ctx.filter = 'none';
    ctx.restore();
  }

  /* ================= 自定义公式 ================= */
  function compileFormula(expr){
    if (!expr || !expr.trim()) return null;
    const clean = expr.replace(/\s+/g, '');
    if (/[^0-9a-zA-Z_+\-*/^().,]/.test(clean)) return null;
    let js = clean
      .replace(/\^/g, '**')
      .replace(/\bsin\b/g, 'Math.sin')
      .replace(/\bcos\b/g, 'Math.cos')
      .replace(/\btan\b/g, 'Math.tan')
      .replace(/\bexp\b/g, 'Math.exp')
      .replace(/\blog\b/g, 'Math.log')
      .replace(/\bsqrt\b/g, 'Math.sqrt')
      .replace(/\babs\b/g, 'Math.abs')
      .replace(/\bPI\b/g, 'Math.PI')
      .replace(/\bpi\b/g, 'Math.PI');
    try {
      const fn = new Function('x', 'return ' + js + ';');
      const test = fn(0.5);
      if (typeof test !== 'number' || !isFinite(test)) return null;
      return fn;
    } catch(e){ return null; }
  }

  function applyFormula(){
    const expr = fxInput.value.trim();
    if (!expr){
      CONFIG.customFormulaOn = false;
      CONFIG.customFormula = null;
      fxApplyBtn.classList.add('off');
      fxApplyBtn.textContent = '应用';
      showToast('已切回音频驱动', true);
      return;
    }
    const fn = compileFormula(expr);
    if (!fn){
      showToast('公式语法错误或不支持的符号');
      return;
    }
    CONFIG.customFormulaOn = true;
    CONFIG.customFormula = fn;
    fxApplyBtn.classList.remove('off');
    fxApplyBtn.textContent = '已启用';
    showToast('已启用：' + expr, true);
  }
  fxApplyBtn.addEventListener('click', () => {
    if (CONFIG.customFormulaOn){
      fxInput.value = '';
      CONFIG.customFormulaOn = false;
      CONFIG.customFormula = null;
      fxApplyBtn.classList.add('off');
      fxApplyBtn.textContent = '应用';
      showToast('已切回音频驱动', true);
    } else {
      applyFormula();
    }
  });
  fxInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') applyFormula();
    e.stopPropagation();  /* 防止触发全局快捷键 */
  });

  /* ================= 渲染 ================= */
  function render(){
    requestAnimationFrame(render);
    if (!mainAnalyser || W === 0) return;
    if (currentSource === 'video' && !hasMedia){
      ctx.clearRect(0, 0, W, H);
      return;
    }

    const now = performance.now();
    if (lastFrameT > 0){
      const dt = now - lastFrameT;
      frameAvg = frameAvg * 0.94 + dt * 0.06;
    }
    lastFrameT = now;

    const live = (currentSource !== 'video') || (!video.paused && !video.ended);
    if (live){
      mainAnalyser.getByteTimeDomainData(mainTimeData);
      mainAnalyser.getByteFrequencyData(mainFreqData);
      frozenMainTime.set(mainTimeData);
      frozenMainFreq.set(mainFreqData);
      if (mainAL && mainAR){
        mainAL.getByteTimeDomainData(leftTimeData);
        mainAR.getByteTimeDomainData(rightTimeData);
        frozenLeftTime.set(leftTimeData);
        frozenRightTime.set(rightTimeData);
      }
    } else {
      mainTimeData.set(frozenMainTime);
      mainFreqData.set(frozenMainFreq);
      leftTimeData.set(frozenLeftTime);
      rightTimeData.set(frozenRightTime);
    }

    updateBeat();
    updatePitch();

    /* ★ f(x) 修复：去掉 Worker，主线程直接跑，每 6 帧一次 */
    if (fxOn && fxAnalyser){
      fxTick++;
      if (fxTick % 6 === 0 && live){
        fxAnalyser.getByteTimeDomainData(fxTimeData);
        computeFxFFT();
        updateFx(true);
      }
    }

    ctx.clearRect(0, 0, W, H);

    const beatZoom = 1 + beatPulse * CONFIG.beat.zoom;
    ctx.save();
    if (beatZoom > 1.0005){
      ctx.translate(W / 2, H / 2);
      ctx.scale(beatZoom, beatZoom);
      ctx.translate(-W / 2, -H / 2);
    }

    if (CONFIG.customFormulaOn && CONFIG.customFormula){
      drawFormulaDriven();
    } else {
      switch (mode){
        case 'bars':      drawBars();      break;
        case 'circle':    drawCircle();    break;
        case 'wave':      drawWave();      break;
        case 'particles': drawParticles(); break;
      }
    }

    if (modeFlash > 0.01){
      ctx.fillStyle = 'rgba(255,255,255,' + (modeFlash * 0.35).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
      modeFlash *= 0.86;
    }
    if (beatPulse > 0.02){
      ctx.fillStyle = 'rgba(255,255,255,' + (beatPulse * CONFIG.beat.flash).toFixed(4) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
    applyBloom();

    if (progressLoaded) drawProgress();
  }

  function drawFormulaDriven(){
    const fn = CONFIG.customFormula;
    const N = 512;
    const vals = new Float32Array(N);
    let minV = 1e9, maxV = -1e9;
    for (let i = 0; i < N; i++){
      const x = (i / N) * 4 * Math.PI;
      let v;
      try { v = fn(x); } catch(e){ v = 0; }
      if (typeof v !== 'number' || !isFinite(v)) v = 0;
      vals[i] = v;
      if (v < minV) minV = v;
      if (v > maxV) maxV = v;
    }
    const range = Math.max(0.001, maxV - minV);
    for (let i = 0; i < N; i++){
      vals[i] = ((vals[i] - minV) / range) * 2 - 1;
    }

    if (mode === 'wave'){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineJoin = 'round';
      ctx.lineCap  = 'round';
      const midY = H * 0.5;
      const amp = H * 0.32;
      const grad = ctx.createLinearGradient(0, 0, W, 0);
      const st = currentTheme.stops;
      for (let i = 0; i < st.length; i++) grad.addColorStop(i / (st.length - 1), st[i]);
      function path(){
        ctx.beginPath();
        for (let i = 0; i < N; i++){
          const x = (i / (N - 1)) * W;
          const y = midY - vals[i] * amp;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
      }
      path(); ctx.strokeStyle = grad; ctx.globalAlpha = 0.22; ctx.lineWidth = 12; ctx.stroke();
      path(); ctx.globalAlpha = 0.45; ctx.lineWidth = 4.5; ctx.stroke();
      path(); ctx.globalAlpha = 1; ctx.lineWidth = 2.4;
      ctx.shadowBlur = 16; ctx.shadowColor = hexToRgba(currentTheme.c1, .85);
      ctx.stroke(); ctx.shadowBlur = 0;
      ctx.restore();
      return;
    }
    if (mode === 'bars'){
      const count = barVals.length;
      const gap = Math.max(1.5, W / 1100);
      const bw = (W - gap * (count + 1)) / count;
      const maxH = H * 0.62;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < count; i++){
        const v = Math.abs(vals[Math.floor(i / count * N)] || 0);
        const h = Math.max(2, v * maxH);
        const x = gap + i * (bw + gap);
        const y = H - h;
        const col = sampleRgb(currentTheme, i / (count - 1));
        ctx.fillStyle = rgbStr(col, 0.5 + v * 0.5);
        roundRect(ctx, x, y, bw, h, Math.min(bw / 2, 5));
        ctx.fill();
      }
      ctx.restore();
      return;
    }
    if (mode === 'circle'){
      const cx = W / 2, cy = H / 2;
      const base = Math.min(W, H) * 0.18;
      const maxLen = Math.min(W, H) * 0.22;
      const count = circleVals.length;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      for (let i = 0; i < count; i++){
        const idx = Math.floor(i / count * N);
        const v = Math.abs(vals[idx]);
        const ang = (i / count) * TAU - Math.PI / 2;
        const ca = Math.cos(ang), sa = Math.sin(ang);
        const len = 3 + v * maxLen;
        const col = sampleRgb(currentTheme, i / (count - 1));
        ctx.strokeStyle = rgbStr(col, 0.5 + v * 0.5);
        ctx.lineWidth = 1.6 + v * 3.4;
        ctx.beginPath();
        ctx.moveTo(cx + ca * base, cy + sa * base);
        ctx.lineTo(cx + ca * (base + len), cy + sa * (base + len));
        ctx.stroke();
      }
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const cx = W / 2, cy = H / 2;
    for (let i = 0; i < 260; i++){
      const idx = Math.floor(i / 260 * N);
      const v = vals[idx];
      const x = cx + (i / 260 - 0.5) * W * 0.9;
      const y = cy - v * H * 0.35;
      const rad = 1.5 + Math.abs(v) * 4;
      const col = sampleRgb(currentTheme, i / 260);
      ctx.fillStyle = rgbStr(col, 0.85);
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBars(){
    bandValues(barVals, CONFIG.bars.fmin, CONFIG.bars.fmax);
    const bass = getBass();
    const count = barVals.length;
    const gap  = Math.max(1.5, W / 1100);
    const bw   = (W - gap * (count + 1)) / count;
    const maxH = H * 0.62;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const glow = ctx.createRadialGradient(W / 2, H * 1.02, 0, W / 2, H * 1.02, H * 0.95);
    glow.addColorStop(0, hexToRgba(currentTheme.c1, 0.05 + bass * 0.17));
    glow.addColorStop(0.55, hexToRgba(currentTheme.c2, 0.02 + bass * 0.07));
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < count; i++){
      const v = barVals[i];
      const h = Math.max(2, v * maxH);
      const x = gap + i * (bw + gap);
      const y = H - h;
      const col = sampleRgb(currentTheme, i / (count - 1));
      ctx.fillStyle = rgbStr(col, 0.42 + v * 0.58);
      roundRect(ctx, x, y, bw, h, Math.min(bw / 2, 5));
      ctx.fill();
      if (v > 0.06){
        const hi = [Math.min(255,col[0]+70), Math.min(255,col[1]+70), Math.min(255,col[2]+70)];
        ctx.fillStyle = rgbStr(hi, v * 0.9);
        roundRect(ctx, x, y, bw, Math.min(4, h), Math.min(bw / 2, 5));
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawCircle(){
    bandValues(circleVals, CONFIG.circle.fmin, CONFIG.circle.fmax);
    const cx = W / 2, cy = H / 2;
    const base   = Math.min(W, H) * 0.155;
    const maxLen = Math.min(W, H) * 0.245;
    const bass   = getBass();
    const N = circleVals.length;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    const pr = base * (0.93 + bass * 0.13);
    ctx.beginPath();
    ctx.arc(cx, cy, pr, 0, TAU);
    ctx.strokeStyle = hexToRgba(currentTheme.c1, 0.2 + bass * 0.55);
    ctx.lineWidth = 1.5;
    ctx.stroke();
    const halo = ctx.createRadialGradient(cx, cy, base * 0.6, cx, cy, base + maxLen * 1.15);
    halo.addColorStop(0, hexToRgba(currentTheme.c1, 0.03 + bass * 0.1));
    halo.addColorStop(1, 'transparent');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx, cy, base + maxLen * 1.2, 0, TAU);
    ctx.fill();
    for (let i = 0; i < N; i++){
      const v = circleVals[i];
      const ang = (i / N) * TAU - Math.PI / 2;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const len = 3 + v * maxLen;
      const x0 = cx + ca * base, y0 = cy + sa * base;
      const x1 = cx + ca * (base + len), y1 = cy + sa * (base + len);
      const col = sampleRgb(currentTheme, i / (N - 1));
      ctx.strokeStyle = rgbStr(col, 0.4 + v * 0.6);
      ctx.lineWidth = 1.6 + v * 3.4;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawWave(){
    const midY = H * 0.5;
    const amp  = H * 0.28;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineJoin = 'round';
    ctx.lineCap  = 'round';
    const grad = ctx.createLinearGradient(0, 0, W, 0);
    const st = currentTheme.stops;
    for (let i = 0; i < st.length; i++) grad.addColorStop(i / (st.length - 1), st[i]);

    function drawSingle(data, midYOffset){
      const n = data.length;
      let maxV = 0, maxIdx = 0;
      for (let i = 0; i < n; i++){
        const v = data[i] - 128;
        const a = v < 0 ? -v : v;
        if (a > maxV){ maxV = a; maxIdx = i; }
      }
      let anchor = waveAnchor;
      if (anchor < 0) anchor = maxIdx;
      else {
        let d = maxIdx - anchor;
        if (d >  n / 2) d -= n;
        if (d < -n / 2) d += n;
        anchor = ((anchor + d * CONFIG.wave.follow) % n + n) % n;
      }
      waveAnchor = anchor;

      const POINTS = Math.max(
        CONFIG.wave.pointsMin,
        Math.min(CONFIG.wave.pointsMax, Math.floor(W / CONFIG.wave.pointsDiv))
      );
      if (!wavePts || wavePts.length !== POINTS * 2){
        wavePts = new Float32Array(POINTS * 2);
      }
      for (let p = 0; p < POINTS; p++){
        const t = p / (POINTS - 1);
        const bufF = anchor + (t - 0.5) * n;
        const bufIdx = ((bufF % n) + n) % n;
        const i0 = Math.floor(bufIdx);
        const i1 = (i0 + 1) % n;
        const frac = bufIdx - i0;
        const v = ((data[i0] * (1 - frac) + data[i1] * frac) - 128) / 128;
        wavePts[p * 2]     = t * W;
        wavePts[p * 2 + 1] = midYOffset + v * amp;
      }
      function buildPath(){
        ctx.beginPath();
        ctx.moveTo(wavePts[0], wavePts[1]);
        for (let i = 1; i < POINTS; i++) ctx.lineTo(wavePts[i * 2], wavePts[i * 2 + 1]);
      }
      buildPath(); ctx.strokeStyle = grad; ctx.globalAlpha = 0.18; ctx.lineWidth = 12; ctx.stroke();
      buildPath(); ctx.globalAlpha = 0.4; ctx.lineWidth = 4.5; ctx.stroke();
      buildPath(); ctx.globalAlpha = 1; ctx.lineWidth = 2.0 + getBass() * 1.2;
      ctx.shadowBlur = 16; ctx.shadowColor = hexToRgba(currentTheme.c1, .85);
      ctx.stroke(); ctx.shadowBlur = 0;
    }

    if (stereoOn && mainAL && mainAR){
      waveAnchor = -1;
      drawSingle(leftTimeData,  H * 0.32);
      waveAnchor = -1;
      drawSingle(rightTimeData, H * 0.68);
    } else {
      waveAnchor = -1;
      drawSingle(mainTimeData, midY);
    }
    ctx.globalAlpha = 0.1;
    ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(W, midY);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }

  function drawParticles(){
    const cx = W / 2, cy = H / 2;
    const bass = getBass();
    const mid  = getMid();
    const maxR = Math.hypot(W, H) * 0.55;
    const maxP = CONFIG.adaptiveQuality
      ? (frameAvg > 24 ? CONFIG.particles.maxLow : CONFIG.particles.maxHigh)
      : CONFIG.particles.maxHigh;
    const spawn = Math.floor(bass * CONFIG.particles.bassRate + mid * CONFIG.particles.midRate);
    for (let k = 0; k < spawn && particles.length < maxP; k++){
      particles.push({
        a: Math.random() * TAU,
        r: 14 + Math.random() * 46,
        va: (Math.random() - 0.5) * 0.024,
        speed: 1.1 + Math.random() * 4.2,
        size: 1.1 + Math.random() * 3.4,
        col: sampleRgb(currentTheme, Math.random()),
        life: 1
      });
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, 130 + bass * 190);
    core.addColorStop(0, hexToRgba(currentTheme.c1, 0.16 + bass * 0.42));
    core.addColorStop(0.5, hexToRgba(currentTheme.c2, 0.05 + bass * 0.15));
    core.addColorStop(1, 'transparent');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(cx, cy, 130 + bass * 200, 0, TAU);
    ctx.fill();
    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.r    += p.speed * (0.55 + bass * 2.6);
      p.a    += p.va;
      p.life -= 0.0075;
      if (p.life <= 0 || p.r > maxR){ particles.splice(i, 1); continue; }
      const x = cx + Math.cos(p.a) * p.r;
      const y = cy + Math.sin(p.a) * p.r;
      const alpha = Math.max(0, p.life) * 0.92;
      const rad = p.size * (0.45 + p.life * 0.75);
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, TAU);
      ctx.fillStyle = rgbStr(p.col, alpha);
      ctx.fill();
    }
    ctx.restore();
  }

  function fmtFreq(f){
    if (f >= 1000) return (f / 1000).toFixed(2) + 'k';
    return f.toFixed(f < 100 ? 1 : 0);
  }
  function fmtPhase(p){
    let v = p % (Math.PI * 2);
    if (v > Math.PI) v -= Math.PI * 2;
    if (v < -Math.PI) v += Math.PI * 2;
    return (v >= 0 ? ' + ' : ' − ') + Math.abs(v).toFixed(2);
  }
  function parabolaPeak(y1, y2, y3){
    const denom = y1 - 2 * y2 + y3;
    if (Math.abs(denom) < 1e-9) return 0;
    return 0.5 * (y1 - y3) / denom;
  }
  function extractPeaks(){
    const sr = audioCtx ? audioCtx.sampleRate : 44100;
    const binHz = sr / FX_FFT;
    const kMin = CONFIG.fft.freqMin;
    const kMax = CONFIG.fft.freqMax;
    const th = CONFIG.fft.peakThreshold;
    const cand = [];
    const loMax = Math.min(Math.floor(kMax / binHz), FX_FFT/2 - 3);
    const loMin = Math.max(2, Math.ceil(kMin / binHz));
    for (let k = loMin; k < loMax; k++){
      const v = fxMag[k];
      if (v < th) continue;
      if (v >= fxMag[k-1] && v > fxMag[k+1] && v >= fxMag[k-2] && v > fxMag[k+2]){
        let kReal = k;
        if (CONFIG.fft.parabolaInterp){
          kReal = k + parabolaPeak(fxMag[k-1], fxMag[k], fxMag[k+1]);
        }
        cand.push({
          freq: kReal * binHz,
          amp: v,
          phase: fxUnwrappedPhase[k] || fxPhase[k]
        });
      }
    }
    cand.sort((a, b) => b.amp - a.amp);
    return cand.slice(0, CONFIG.fft.maxPeaks);
  }
  function updateFx(){
    if (!fxOn || !audioCtx) return;
    if (CONFIG.customFormulaOn) return;
    const peaks = extractPeaks();
    let html = '<span class="fn">f</span><span class="dim">(x) = </span>';
    if (peaks.length === 0){
      html += '<span class="num">0</span>';
    } else {
      const parts = [];
      peaks.forEach((p, idx) => {
        const amp = p.amp.toFixed(2);
        const coef = (amp === '1.00') ? '' : ('<span class="num">' + amp + '</span>·');
        let term = coef +
          '<span class="fn">cos</span><span class="dim">(2π·</span>' +
          '<span class="num">' + fmtFreq(p.freq) + '</span>' +
          '<span class="dim">·x</span>' +
          '<span class="ph">' + fmtPhase(p.phase) + '</span>' +
          '<span class="dim">)</span>';
        if (idx > 0) term = '<span class="dim"> + </span>' + term;
        parts.push(term);
      });
      html += parts.join('');
    }
    fxFormula.innerHTML = html;
    fxBadge.textContent = peaks.length ? 'REAL · 含相位' : 'SILENT';
    drawFxGraph(peaks);
  }
  function drawFxGraph(peaks){
    const rect = fxGraph.getBoundingClientRect();
    const gw = Math.max(1, Math.round(rect.width));
    const gh = Math.max(1, Math.round(rect.height));
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (fxGraph.width !== gw * dpr || fxGraph.height !== gh * dpr){
      fxGraph.width  = gw * dpr;
      fxGraph.height = gh * dpr;
    }
    fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fxCtx.clearRect(0, 0, gw, gh);
    fxCtx.strokeStyle = 'rgba(255,255,255,.06)';
    fxCtx.lineWidth = 1;
    fxCtx.beginPath();
    for (let i = 1; i < 4; i++){
      const x = (i / 4) * gw;
      fxCtx.moveTo(x, 0); fxCtx.lineTo(x, gh);
    }
    fxCtx.moveTo(0, gh / 2); fxCtx.lineTo(gw, gh / 2);
    fxCtx.stroke();

    if (CONFIG.customFormulaOn && CONFIG.customFormula){
      const fn = CONFIG.customFormula;
      const grad = fxCtx.createLinearGradient(0, 0, gw, 0);
      const st = currentTheme.stops;
      for (let i = 0; i < st.length; i++) grad.addColorStop(i / (st.length - 1), st[i]);
      const M = Math.max(120, gw);
      let minV = 1e9, maxV = -1e9;
      const vals = new Float32Array(M + 1);
      for (let i = 0; i <= M; i++){
        const x = (i / M) * 4 * Math.PI;
        let v;
        try { v = fn(x); } catch(e){ v = 0; }
        if (typeof v !== 'number' || !isFinite(v)) v = 0;
        vals[i] = v;
        if (v < minV) minV = v;
        if (v > maxV) maxV = v;
      }
      const range = Math.max(0.001, maxV - minV);
      fxCtx.beginPath();
      for (let i = 0; i <= M; i++){
        const px = (i / M) * gw;
        const py = gh / 2 - ((vals[i] - minV) / range * 2 - 1) * (gh / 2 - 6);
        if (i === 0) fxCtx.moveTo(px, py); else fxCtx.lineTo(px, py);
      }
      fxCtx.strokeStyle = grad;
      fxCtx.lineWidth = 1.8;
      fxCtx.lineJoin = 'round';
      fxCtx.shadowBlur = 10;
      fxCtx.shadowColor = hexToRgba(currentTheme.c1, .7);
      fxCtx.stroke();
      fxCtx.shadowBlur = 0;
      return;
    }

    if (peaks.length === 0){
      fxCtx.beginPath();
      fxCtx.moveTo(0, gh / 2); fxCtx.lineTo(gw, gh / 2);
      fxCtx.strokeStyle = hexToRgba(currentTheme.c1, .35);
      fxCtx.lineWidth = 1.6;
      fxCtx.stroke();
      return;
    }
    let maxF = 0;
    for (const p of peaks) if (p.freq > maxF) maxF = p.freq;
    if (maxF < 50) maxF = 50;
    const span = 4 / maxF;
    let ampSum = 0;
    for (const p of peaks) ampSum += p.amp;
    if (ampSum < 1e-4) ampSum = 1;
    const grad = fxCtx.createLinearGradient(0, 0, gw, 0);
    const st = currentTheme.stops;
    for (let i = 0; i < st.length; i++) grad.addColorStop(i / (st.length - 1), st[i]);
    const M = Math.max(160, gw);
    const pad = 6;
    fxCtx.beginPath();
    for (let i = 0; i <= M; i++){
      const x = (i / M) * span;
      let y = 0;
      for (const p of peaks){
        y += p.amp * Math.cos(2 * Math.PI * p.freq * x + p.phase);
      }
      y /= ampSum;
      const px = (i / M) * gw;
      const py = gh / 2 - y * (gh / 2 - pad);
      if (i === 0) fxCtx.moveTo(px, py);
      else fxCtx.lineTo(px, py);
    }
    fxCtx.strokeStyle = grad;
    fxCtx.lineWidth = 1.8;
    fxCtx.lineJoin = 'round';
    fxCtx.shadowBlur = 10;
    fxCtx.shadowColor = hexToRgba(currentTheme.c1, .7);
    fxCtx.stroke();
    fxCtx.shadowBlur = 0;
  }

  async function computeProgressPeaks(file){
    try {
      const arrayBuf = await file.arrayBuffer();
      const tmpCtx = new (window.AudioContext || window.webkitAudioContext)();
      const decoded = await tmpCtx.decodeAudioData(arrayBuf.slice(0));
      tmpCtx.close();
      const ch = decoded.getChannelData(0);
      const N = 400;
      const blockSize = Math.floor(ch.length / N);
      const peaks = new Float32Array(N);
      for (let i = 0; i < N; i++){
        let max = 0;
        const start = i * blockSize;
        for (let j = 0; j < blockSize; j += 4){
          const v = Math.abs(ch[start + j] || 0);
          if (v > max) max = v;
        }
        peaks[i] = max;
      }
      let mx = 0;
      for (let i = 0; i < N; i++) if (peaks[i] > mx) mx = peaks[i];
      if (mx > 0) for (let i = 0; i < N; i++) peaks[i] /= mx;
      progressPeaks = peaks;
      progressLoaded = true;
      progressWrap.classList.add('show');
      drawProgress();
    } catch(e){
      console.warn('progress compute failed:', e);
      progressPeaks = null;
      progressLoaded = false;
    }
  }

  function drawProgress(){
    if (!progressPeaks) return;
    const wp = waveProgress.parentElement.getBoundingClientRect();
    const w = wp.width;
    const h = wp.height;
    wpCtx.clearRect(0, 0, w, h);
    const N = progressPeaks.length;
    const barW = w / N;
    const dur = video.duration || 1;
    const cur = video.currentTime || 0;
    const progress = cur / dur;
    for (let i = 0; i < N; i++){
      const v = progressPeaks[i];
      const bh = Math.max(1, v * (h - 4));
      const x = i * barW;
      const y = (h - bh) / 2;
      const played = (i / N) < progress;
      wpCtx.fillStyle = played ? currentTheme.c1 : 'rgba(255,255,255,.18)';
      wpCtx.fillRect(x + 0.5, y, Math.max(0.5, barW - 1), bh);
    }
    const px = progress * w;
    wpCtx.fillStyle = '#fff';
    wpCtx.fillRect(px - 1, 0, 2, h);
  }

    const fn = compileFormula(savedExpr);
    if (fn){
      CONFIG.customFormulaOn = true;
      CONFIG.customFormula = fn;
      fxApplyBtn.classList.remove('off');
      fxApplyBtn.textContent = '已启用';
    }
  }
  if (savedMode && savedMode !== 'bars'){
    document.querySelectorAll('.mode-btn').forEach(b => {
      if (b.dataset.mode === savedMode){
        document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        mode = savedMode;
      }
    });
  }

  resize();
  paintSeek(0);
  paintVol(1);
  playBtn.innerHTML = ICON_PLAY;
  requestAnimationFrame(render);

})();
</script>
</body>
</html>
